[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refugio-animal-paraguay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "stripe>=8.0",
    "slowapi>=0.1.9",
    "aiosmtplib>=3.0",
    "jinja2>=3.1.4",  # CVE-2024-22195, CVE-2024-34064 fixed in 3.1.4
    "fpdf2>=2.7",
    "twilio>=9.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyright>=1.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "black>=24.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests requiring a live database (deselect with -m 'not integration')",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
pythonPlatform = "Linux"
extraPaths = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/api/*.py" = ["B008"]  # FastAPI uses Query()/Depends() in function defaults by design
"src/auth/*.py" = ["B008"]  # FastAPI uses Depends() in function defaults by design

[tool.coverage.run]
source = ["src"]
omit = [
    "src/db/alembic/*",
    "src/db/alembic/versions/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.black]
target-version = ["py312"]
line-length = 100
