services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refugio_dev
      POSTGRES_USER: refugio_user
      POSTGRES_PASSWORD: refugio_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refugio_user -d refugio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Expose to host for local tooling (psql, pgAdmin, Alembic from host)
      - "5434:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://refugio_user:refugio_pass@db:5432/refugio_dev
      APP_ENV: development
      DEBUG: "false"
      # Secrets — override via .env or CI environment variables
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-must-be-32-chars-min}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
