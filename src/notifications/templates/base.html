<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject | default("Refugio Animal Paraguay") }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; }
    .header { background-color: #2d6a4f; padding: 24px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 22px; }
    .header p { color: #b7e4c7; margin: 4px 0 0; font-size: 14px; }
    .content { padding: 32px 24px; color: #333333; line-height: 1.6; }
    .content h2 { color: #2d6a4f; margin-top: 0; }
    .footer { background-color: #f8f9fa; padding: 16px 24px; text-align: center; font-size: 12px; color: #6c757d; border-top: 1px solid #dee2e6; }
    .btn { display: inline-block; padding: 12px 24px; background-color: #2d6a4f; color: #ffffff; text-decoration: none; border-radius: 4px; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Refugio Animal Paraguay</h1>
      <p>Giving animals a second chance</p>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>Refugio Animal Paraguay &mdash; Asunci&oacute;n, Paraguay</p>
      <p>This is an automated message. Please do not reply directly to this email.</p>
    </div>
  </div>
</body>
</html>
