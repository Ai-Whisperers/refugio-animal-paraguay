name: Dependency Vulnerability Scan

# Runs on every PR/push AND weekly to catch newly-disclosed CVEs between pushes.
#
# Push/PR behavior: hard-fails the build if pip-audit finds any vulnerability.
# Scheduled behavior: opens a GitHub Issue when new vulnerabilities are found,
#   so the team is notified even without an active PR.
#
# To suppress a false positive or an unfixable transitive vulnerability:
#   Add the OSV ID to .pip-audit-ignore (one ID per line, # comments allowed).

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Every Monday at 08:00 UTC — catches CVEs disclosed over the weekend.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      create_issue:
        description: "Create GitHub Issue if vulnerabilities found"
        required: false
        default: "true"
        type: boolean

jobs:
  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build ignore-vuln flags from .pip-audit-ignore
        id: ignore_flags
        run: |
          FLAGS=""
          if [ -f ".pip-audit-ignore" ]; then
            while IFS= read -r line; do
              # Strip comments and blank lines
              clean="${line%%#*}"
              clean="${clean// /}"
              if [ -n "$clean" ]; then
                FLAGS="$FLAGS --ignore-vuln $clean"
              fi
            done < ".pip-audit-ignore"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: pip-audit scan (hard-fail on any vulnerability)
        id: audit
        # Hard-fail so PRs cannot merge with known vulnerable dependencies.
        # To suppress a false positive: add the OSV ID to .pip-audit-ignore.
        run: |
          pip-audit \
            --strict \
            --progress-spinner off \
            ${{ steps.ignore_flags.outputs.flags }}

      - name: pip-audit JSON report (artifact)
        if: always()
        run: |
          pip-audit \
            --format json \
            --output pip-audit-report.json \
            --progress-spinner off \
            ${{ steps.ignore_flags.outputs.flags }} || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Create GitHub Issue on scheduled scan failure
        # Only create an issue on the weekly scheduled run (or manual trigger),
        # not on every PR failure — PRs block themselves already.
        if: |
          failure() &&
          steps.audit.outcome == 'failure' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Security] Vulnerable dependencies detected — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Vulnerable Dependencies Detected',
              '',
              `The weekly pip-audit scan found vulnerable dependencies on \`${context.ref}\`.`,
              '',
              '**Action required**: Review the [workflow run](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                ') and either:',
              '- Upgrade the affected package(s), or',
              '- Add the OSV ID to `.pip-audit-ignore` with a comment explaining why it is suppressed',
              '',
              '> This issue was created automatically by the dependency scan workflow.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['security', 'dependencies'],
            });

            const existingIssue = issues.find(i => i.title.startsWith('[Security] Vulnerable dependencies detected'));
            if (existingIssue) {
              // Add a comment to the existing issue instead of opening a duplicate.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Vulnerability still present as of ${new Date().toISOString().split('T')[0]}. [Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
            }
