name: Security Scan

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  security:
    name: Bandit SAST + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit SAST scan (MEDIUM+ severity)
        # Fails on any MEDIUM or HIGH severity finding in src/
        run: bandit -r src/ -ll

      - name: Bandit JSON report (artifact)
        if: always()
        run: bandit -r src/ -ll --format json --output bandit-report.json || true

      # pip-audit dependency scanning has been moved to dependency-scan.yml (RAP-241),
      # which runs on PR/push AND on a weekly schedule with automatic GitHub Issue creation.
      # This step is retained as a lightweight summary reference only.

      - name: Security headers audit script validation
        # Full live-server audit (run manually or post-deploy):
        #   python3 scripts/check_security_headers.py --url https://sunstein.cloud/petShelter/
        # CI validates the script is syntactically correct and importable.
        run: python3 -c "import sys; sys.path.insert(0, 'scripts'); import check_security_headers; print('check_security_headers script OK')"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
