name: Deploy to Production

on:
  push:
    branches:
      - main
  # Allow triggering production deploy manually from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to deploy (defaults to main)"
        required: false
        default: main

jobs:
  deploy-production:
    name: Deploy to Production (sunstein.cloud/petShelter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Environment with required reviewers — set up protection rules in:
    # Settings → Environments → production → Required reviewers
    # This creates the manual approval gate before any production deploy proceeds.
    environment:
      name: production
      url: https://sunstein.cloud/petShelter

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to production VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -e
             cd /opt/refugio-animal-paraguay
             git fetch origin main
             git checkout main
             git reset --hard origin/main
             docker compose -f docker-compose.deploy.yml build
             docker compose -f docker-compose.deploy.yml up -d'

      - name: Production health check
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'docker compose -f /opt/refugio-animal-paraguay/docker-compose.deploy.yml \
               ps --format "table {{.Name}}\t{{.Status}}" && \
             curl -sf --max-time 15 https://sunstein.cloud/petShelter/api/health \
               && echo "Production API healthy" \
               || echo "Production API not yet responding"'

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/deploy_key
