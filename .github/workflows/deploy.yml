name: Deploy to VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /opt/refugio-animal-paraguay && \
             git fetch origin develop && \
             git reset --hard origin/develop && \
             docker compose -f docker-compose.deploy.yml build && \
             docker compose -f docker-compose.deploy.yml up -d'

      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'curl -sf http://localhost:8000/health || echo "API health check failed"
             docker compose -f docker-compose.deploy.yml ps --format "table {{.Name}}\t{{.Status}}"'

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/deploy_key
