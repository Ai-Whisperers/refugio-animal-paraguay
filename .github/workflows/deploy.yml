# Deployment Pipeline — Refugio Animal Paraguay
# Triggers on main merge and release tags.
# Re-runs tests, builds Docker image, runs smoke tests,
# and deploys with manual approval for production.

name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "release-*"

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # Stage 1: Re-run full test suite against the merged code
  # ------------------------------------------------------------------
  verify:
    name: Verify Tests Pass
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: refugio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d refugio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/refugio_test
      DATABASE_URL_SYNC: postgresql://test_user:test_password@localhost:5432/refugio_test
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-deploy-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-deploy-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run database migrations
        run: PYTHONPATH=. python -m alembic upgrade head

      - name: Run full test suite
        run: |
          PYTHONPATH=. python -m pytest \
            --tb=short \
            --cov=src \
            --cov-fail-under=80 \
            -v

  # ------------------------------------------------------------------
  # Stage 2: Build and push Docker image
  # ------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=match,pattern=release-(.*),group=1

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Stage 3: Deploy to staging (automatic on main merge)
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "-- Staging deployment --"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"
          echo ""
          echo "TODO: Replace with actual hosting provider deployment command."
          echo "Candidates: Fly.io, Render, Railway, or self-hosted Docker."
          echo ""
          echo "Example (Fly.io):"
          echo "  flyctl deploy --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-\${GITHUB_SHA::7}"

      - name: Smoke test - health endpoint
        run: |
          echo "-- Smoke test: GET /health --"
          echo "TODO: Replace with actual curl once staging URL is configured."
          echo "  curl -f \$STAGING_URL/health || exit 1"

      - name: Smoke test - animals endpoint
        run: |
          echo "-- Smoke test: GET /animals --"
          echo "TODO: Replace with actual curl once staging URL is configured."
          echo "  curl -f \$STAGING_URL/animals || exit 1"

  # ------------------------------------------------------------------
  # Stage 4: Deploy to production (manual approval required)
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/release-')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Record previous deployment
        run: |
          echo "-- Recording current production state for rollback --"
          echo "Previous commit: (would query hosting provider API)"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deploy to production
        run: |
          echo "-- Production deployment --"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"
          echo ""
          echo "TODO: Replace with actual hosting provider deployment command."
          echo "Manual approval gate is enforced by the 'production' GitHub Environment."

      - name: Smoke test - health endpoint
        run: |
          echo "-- Smoke test: GET /health --"
          echo "TODO: Replace with actual curl once production URL is configured."
          echo "  curl -f \$PRODUCTION_URL/health || exit 1"

      - name: Smoke test - animals endpoint
        run: |
          echo "-- Smoke test: GET /animals --"
          echo "TODO: Replace with actual curl once production URL is configured."
          echo "  curl -f \$PRODUCTION_URL/animals || exit 1"

      - name: Log deployment
        run: |
          echo "-- Deployment record --"
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
