# CI Pipeline — Refugio Animal Paraguay
# Runs lint, type-check, format-check, and tests on every push and PR.
# Jobs are sequential: lint -> type-check -> format-check -> test
# to fail fast on cheap checks before running expensive tests.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-lint-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff linter
        run: python -m ruff check src/ tests/

  type-check:
    name: Type Check (pyright)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-typecheck-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pyright type checker
        run: PYTHONPATH=. python -m pyright src/

  format-check:
    name: Format Check (black)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-format-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-format-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check code formatting
        run: python -m black --check src/ tests/

  test:
    name: Test Suite
    needs: [type-check, format-check]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: refugio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d refugio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/refugio_test
      DATABASE_URL_SYNC: postgresql://test_user:test_password@localhost:5432/refugio_test
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run database migrations
        run: PYTHONPATH=. python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=80 \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          retention-days: 14

  security:
    name: Security Scan (bandit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-security-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run bandit security scan
        run: python -m bandit -r src/ -q

      - name: Run pip-audit dependency scan
        run: python -m pip_audit
