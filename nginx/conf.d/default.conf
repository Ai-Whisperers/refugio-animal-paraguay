server {
    listen 80;
    server_name sunstein.cloud www.sunstein.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name sunstein.cloud www.sunstein.cloud;

    ssl_certificate     /etc/letsencrypt/live/sunstein.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunstein.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    location = / { return 302 /petShelter; }

    location /petShelter/api/ {
        rewrite ^/petShelter/api(/.*)$ $1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /petShelter/docs {
        rewrite ^/petShelter(/docs.*)$ $1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /petShelter/openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # --- Media files: images, documents, optimized assets ---
    # UUID-based filenames are immutable — aggressive caching is safe.
    # WebP negotiation: Nginx checks for .webp variant via $webp_suffix map.
    location /petShelter/media/ {
        alias /var/www/media/;
        autoindex off;

        # Immutable caching (1 year) — safe because filenames contain UUIDs
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # ETag and Last-Modified for conditional requests (304 Not Modified)
        etag on;
        if_modified_since exact;

        # Security and CORS headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept, Accept-Encoding" always;

        # Restrict to known media file types only
        location ~* \.(jpg|jpeg|png|webp|gif|svg|pdf)$ {
            # For image files, try the WebP variant first if client supports it
            try_files $uri$webp_suffix $uri =404;
        }

        # Block requests for non-media file types
        location ~* \.(?!(jpg|jpeg|png|webp|gif|svg|pdf)$)[^.]+$ {
            return 403;
        }

        try_files $uri =404;
    }

    location /petShelter {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
